# Messages prêts à publier. Règles : un conseil utile d'abord, respecter le règlement
# de chaque groupe, toujours signaler le lien d'affiliation, aucune promesse médicale.

[[facebook]]
titre = "Lèvres gercées (groupes beauté, bons plans)"
texte = """Lèvres gercées dès les premiers froids ? 💋 Trois réflexes qui changent tout :

✅ mettre son baume AVANT de sortir, pas une fois les lèvres abîmées
✅ ne pas se lécher les lèvres (la salive les assèche encore plus)
✅ le soir, une bonne couche en masque de nuit

Pour choisir un baume qui protège vraiment (karité, cire, sans parfum, SPF pour le ski), j'ai fait un petit guide : https://lattendu1987-dev.github.io/eclat-doux/baume-levres-gercees.html
(lien affilié : petite commission pour moi, aucun surcoût pour vous)"""

[[facebook]]
titre = "Calendrier de l'Avent beauté (groupes beauté, mamans, bons plans)"
texte = """Les calendriers de l'Avent beauté partent vite chaque année 🎄 Avant de craquer :

✅ regardez la liste du contenu (la plupart des marques la publient)
✅ miniatures ou formats complets ? Ça change tout pour le rapport qualité-prix
✅ soins ou maquillage : un calendrier de soins plaît plus facilement en cadeau

Ma checklist complète : https://lattendu1987-dev.github.io/eclat-doux/calendrier-avent-beaute.html
(lien affilié : petite commission pour moi, aucun surcoût pour vous)"""

[[facebook]]
titre = "Mains sèches (groupes beauté, santé au naturel)"
texte = """Mains qui tiraillent avec le froid et les lavages ? 🤲

Ce qui aide vraiment :
✅ une crème légère en journée, une crème riche le soir
✅ chercher glycérine, karité ou urée dans les ingrédients
✅ des gants dehors et un petit tube dans le sac

Le guide pour bien choisir : https://lattendu1987-dev.github.io/eclat-doux/creme-mains-seches.html
(lien affilié : petite commission pour moi, aucun surcoût pour vous)"""

[[facebook]]
titre = "Coffrets cadeaux beauté (groupes cadeaux, bons plans Noël)"
texte = """Besoin d'une idée cadeau beauté qui fait plaisir à coup sûr ? 🎁

✅ restez sur des valeurs sûres : soins des mains, bain, bougies
✅ le parfum, seulement si vous connaissez celui qu'elle/il porte
✅ vérifiez la date de livraison avant de commander

Mes idées par profil : https://lattendu1987-dev.github.io/eclat-doux/coffret-cadeau-beaute-noel.html
(lien affilié : petite commission pour moi, aucun surcoût pour vous)"""

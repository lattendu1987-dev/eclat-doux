# Classements officiels Amazon (mis à jour par Amazon, environ toutes les heures).
# Aucun produit n'est copié : on renvoie vers les pages d'Amazon avec l'identifiant Partenaire.
# tag vide = lien sans commission (pas encore inscrit au programme de ce pays).

lists = [
  { path = "gp/bestsellers/beauty", fr = "Meilleures ventes", en = "Best sellers", icon = "🏆" },
  { path = "gp/new-releases/beauty", fr = "Nouveautés", en = "New releases", icon = "✨" },
  { path = "gp/movers-and-shakers/beauty", fr = "Plus fortes progressions", en = "Movers & shakers", icon = "📈" },
  { path = "gp/most-wished-for/beauty", fr = "Les plus souhaités", en = "Most wished for", icon = "💝" },
]

